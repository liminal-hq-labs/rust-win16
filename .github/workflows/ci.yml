name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  headers:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check SPDX headers
        run: bash scripts/check-headers.sh

  banner:
    name: Hero banner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils librsvg2-bin fonts-dejavu-core fonts-liberation

      # The runner image ships Google Chrome, which the text-fit pass drives headless.
      - name: Check the banner
        env:
          BANNER_REQUIRE_RENDER: '1'
        run: bash scripts/check-banner.sh

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the compiler and its components; rustup installs them on first use.
      - name: Check formatting
        run: cargo fmt --all -- --check

  packer-tests:
    name: Packer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run the packer and stub generator tests
        run: python3 -m unittest discover -s tests -v

  build:
    name: Build examples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-win16

      - name: Build and pack the examples
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/w16-target
          OUT_DIR: ${{ runner.temp }}/w16-out
        run: bash scripts/build.sh

      - name: Check the output is a Win16 NE executable
        env:
          OUT_DIR: ${{ runner.temp }}/w16-out
        run: |
          for exe in MSGBOX HELLO SETUP; do
            file "$OUT_DIR/$exe.EXE" | tee /dev/stderr | grep -q 'NE version'
            python3 tools/ne_dump.py "$OUT_DIR/$exe.EXE" >/dev/null
          done
