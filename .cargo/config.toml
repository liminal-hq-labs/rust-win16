[build]
target = "win16.json"

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.win16]
rustflags = ["-C", "link-arg=-Tlink.ld", "-C", "link-arg=--no-dynamic-linker"]
